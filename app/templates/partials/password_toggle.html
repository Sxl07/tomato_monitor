{% macro password_toggle(input_id) -%}
<button type="button" class="password-toggle" aria-controls="{{ input_id }}"
        aria-label="Mostrar contraseña" aria-pressed="false" data-password-toggle>
    <svg class="password-icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true" focusable="false">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
        <circle cx="12" cy="12" r="3"/>
    </svg>
    <svg class="password-icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true" focusable="false">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
        <circle cx="12" cy="12" r="3"/>
        <path d="M3 3l18 18"/>
    </svg>
</button>
{%- endmacro %}
