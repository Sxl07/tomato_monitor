{% extends "base_agricultural.html" %}
{% from "agricultural/partials/icons.html" import icon %}
{% block title %}Error{% endblock %}
{% block content %}
<div style="padding: 32px 16px; text-align: center;">
    <div style="font-size: 48px; margin-bottom: 16px;">{{ icon('warning') }}</div>
    <h1 style="font-size: 24px; color: #212121; margin-bottom: 12px;">Ha ocurrido un error</h1>
    <p style="font-size: 16px; color: #616161; margin-bottom: 24px;">{{ message }}</p>
    <a href="/invernaderos" style="display: inline-block; padding: 12px 24px; background: #4CAF50; color: white; text-decoration: none; border-radius: 4px; font-size: 16px;">Volver al inicio</a>
</div>
{% endblock %}
