{% extends "base_agricultural.html" %}

{% block header_title %}
{% if mode == "edit" %}Editar Invernadero{% else %}Crear Invernadero{% endif %}
{% endblock %}

{% block content %}
{% if errors %}
<div class="alert alert-error" role="alert">
    {% for error in errors %}
    <p>{{ error }}</p>
    {% endfor %}
</div>
{% endif %}

<form method="post" class="form" novalidate>
    <div class="form-group">
        <label for="name" class="form-label">Nombre del invernadero</label>
        <input
            type="text"
            id="name"
            name="name"
            class="form-input"
            value="{{ name or '' }}"
            required
            placeholder="Ej: Invernadero Principal"
            autocomplete="off"
        >
    </div>

    <div class="form-group">
        <label for="location" class="form-label">Ubicación (opcional)</label>
        <input
            type="text"
            id="location"
            name="location"
            class="form-input"
            value="{{ location or '' }}"
            placeholder="Ej: Sector norte, parcela 3"
            autocomplete="off"
        >
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">
            {% if mode == "edit" %}Guardar Cambios{% else %}Crear Invernadero{% endif %}
        </button>
        <a href="{% if mode == 'edit' %}/invernaderos/{{ greenhouse_id }}{% else %}/invernaderos{% endif %}" class="btn btn-secondary">
            Cancelar
        </a>
    </div>
</form>
{% endblock %}
