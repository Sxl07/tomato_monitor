<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{ title or "Monitor de Tomates" }}</title>
    <link rel="stylesheet" href="/static/css/agricultural.css">
</head>
<body>
    <header class="app-header">
        {% block header %}
        <div class="header-content">
            {% if show_back %}
            <a href="{{ back_url }}" class="back-button" aria-label="Volver">←</a>
            {% endif %}
            <h1 class="header-title">{% block header_title %}Monitor de Tomates{% endblock %}</h1>
            {% block header_actions %}{% endblock %}
        </div>
        {% endblock %}
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <nav class="bottom-nav" aria-label="Navegación principal">
        <a href="/dashboard" class="bottom-nav__item">🏠<span>Inicio</span></a>
        <a href="/invernaderos" class="bottom-nav__item">🌱<span>Módulos</span></a>
        <a href="/exportar" class="bottom-nav__item">📦<span>Exportar</span></a>
        <a href="/sincronizacion" class="bottom-nav__item">🔄<span>Sync</span></a>
    </nav>

    {% block scripts %}{% endblock %}
</body>
</html>
