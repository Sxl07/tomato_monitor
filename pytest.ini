[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -m "not supabase"
markers =
    raspberry: tests requiring Raspberry Pi hardware
    hardware: tests requiring physical hardware (motors, GPIO, camera)
    slow: slow tests or benchmarks (not for CI)
    integration: integration tests requiring full stack
    supabase: tests requiring real Supabase project and network (not for CI)
